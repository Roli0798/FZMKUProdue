<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#CDA3A5">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flavia Zambrana Makeup Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#CDA3A5;--bg2:#C0999B;--card:rgba(255,255,255,.62);--tx:#3A0E1E;--mu:#5e3a45;--bd:#A88587;--ac:#8E2D3B;--ac2:#F5E9ED;--on:#fff;--rd:#8E2D3B;--inp:#F5E9ED;--sh:0 6px 20px rgba(58,14,30,.10);--plate:transparent;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--script:"Pinyon Script","Snell Roundhand",cursive;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--tx);font:15px/1.45 Jost,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:8px 14px 44px}
.brand{text-align:center;padding:10px 0 6px}
.plate{background:var(--plate);border-radius:18px;padding:8px 16px;display:inline-block}
.brand img{display:block;width:min(250px,70vw);height:auto}
.slogan{font-family:var(--script);font-size:26px;color:#6E1F2E;margin:2px 0 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 15px;border-radius:999px;font:inherit;letter-spacing:.03em;cursor:pointer}
nav button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card h2{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;color:var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px;letter-spacing:.04em}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--inp);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:999px;padding:11px 20px;font:inherit;letter-spacing:.04em;cursor:pointer;margin-top:12px}
.btn.s{padding:6px 12px;margin:0;font-size:13px}
.btn.g{background:transparent;color:var(--rd);border:1px solid var(--bd)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}
.mu{color:var(--mu);font-size:13px}
.tot{display:inline-block;font-family:var(--serif);font-size:30px;font-weight:700;color:var(--on);background:var(--ac);border-radius:999px;padding:2px 22px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.kpi b{display:block;font-family:var(--serif);font-size:28px;color:var(--ac)}
.tag{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--ac2);color:var(--ac)}
.tag.c{background:transparent;border:1px solid var(--rd)}
.act{display:flex;gap:6px;flex-shrink:0}
.demo{background:var(--ac2);border:1px dashed var(--ac);border-radius:14px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.logo-l{filter:brightness(.8)}
</style>
</head>

<script>
var KEY="fz-studio-v1",S={items:[],clients:[],appts:[],sales:[]},tab="cobrar",cart=[],cartAppt=null,cartClient="",fDate="";
function seed(){var d=new Date(),t=ymd(d),n=ymd(new Date(d.getTime()+864e5)),M="Maquillaje de quinceañera (larga duración)",P="Peinado de quinceañera",R="Prueba de maquillaje de quinceañera";
S={demo:true,items:[{id:"i1",name:M,type:"Servicio",price:320},{id:"i2",name:P,type:"Servicio",price:160},{id:"i3",name:R,type:"Servicio",price:250}],
clients:[{id:"c1",name:"Valeria Quispe",phone:"70000001",notes:"Quinceañera"},{id:"c2",name:"Camila Rojas",phone:"70000002",notes:""},{id:"c3",name:"Daniela Mamani",phone:"70000003",notes:"Prefiere tonos rosados"}],
appts:[{id:"a1",date:t,time:"10:00",client:"c1",item:"i1",note:"Evento en la tarde",status:"pendiente"},{id:"a2",date:t,time:"15:30",client:"c2",item:"i3",note:"",status:"pendiente"},{id:"a3",date:n,time:"09:00",client:"c3",item:"i2",note:"",status:"pendiente"}],
sales:[{id:"s1",date:t,time:"09:10",client:"c3",method:"QR",total:250,lines:[{name:R,price:250,q:1}]},{id:"s2",date:t,time:"11:40",client:"c2",method:"Efectivo",total:480,lines:[{name:M,price:320,q:1},{name:P,price:160,q:1}]},{id:"s3",date:t.slice(0,8)+"02",time:"16:00",client:"c1",method:"Transferencia",total:320,lines:[{name:M,price:320,q:1}]}]}}
function load(){var r=null;try{r=localStorage.getItem(KEY)}catch(e){}if(r){try{S=JSON.parse(r)}catch(e){}}else{seed();S.demo=false;S.clients=[];S.appts=[];S.sales=[];save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function p2(n){return(n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function money(n){return "Bs "+(Math.round(n*100)/100).toLocaleString("es-BO",{minimumFractionDigits:2,maximumFractionDigits:2})}
function item(id){return S.items.find(function(i){return i.id===id})}
function cli(id){return S.clients.find(function(c){return c.id===id})}
function cname(id){var c=cli(id);return c?c.name:"Sin cliente"}
var TABS=[["cobrar","Cobrar"],["agenda","Agenda"],["clientes","Clientes"],["resumen","Resumen"],["catalogo","Servicios/Productos"]];
function nav(){$("nav").innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")}
function go(t){tab=t;nav();render()}
function cliOpts(sel){return '<option value="">Sin cliente</option>'+S.clients.map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?" selected":"")+'>'+esc(c.name)+'</option>'}).join("")}
function itemOpts(sel){return S.items.map(function(i){return '<option value="'+i.id+'"'+(i.id===sel?" selected":"")+'>'+esc(i.name)+' ('+money(i.price)+')</option>'}).join("")}
function cartTotal(){return cart.reduce(function(a,l){var i=item(l.id);return a+(i?i.price*l.q:0)},0)}

function vCobrar(){
 var h='<div class="card"><h2>Nuevo cobro</h2><label>Cliente</label><select id="cc">'+cliOpts(cartClient)+'</select>';
 if(!S.items.length)return h+'<p class="mu">Primero agrega servicios o productos en la pestaña Servicios/Productos.</p></div>'+vVentas();
 h+='<div class="row"><div style="flex:3"><label>Servicio o producto</label><select id="ci">'+itemOpts()+'</select></div><div><label>Cant.</label><input id="cq" type="number" min="1" value="1"></div></div><button class="btn s" data-a="addcart" style="margin-top:8px">Agregar</button>';
 h+='<div style="margin-top:10px">'+cart.map(function(l,n){var i=item(l.id);return '<div class="item"><span>'+l.q+' × '+esc(i.name)+'</span><span>'+money(i.price*l.q)+' <button class="btn s g" data-a="rmcart" data-n="'+n+'">✕</button></span></div>'}).join("")+'</div>';
 h+='<div class="tot">'+money(cartTotal())+'</div><label>Método de pago</label><select id="cm"><option>Efectivo</option><option>QR</option><option>Transferencia</option><option>Tarjeta</option></select>';
 h+='<button class="btn" data-a="pay">Registrar cobro</button></div>';
 return h+vVentas();
}
function vVentas(){
 var l=S.sales.slice().reverse().slice(0,15);
 return '<div class="card"><h2>Últimos cobros</h2>'+(l.length?l.map(function(s){return '<div class="item"><div>'+esc(cname(s.client))+'<div class="mu">'+s.date+' '+s.time+' · '+esc(s.method)+' · '+s.lines.map(function(x){return x.q+'×'+esc(x.name)}).join(", ")+'</div></div><div><b>'+money(s.total)+'</b> <button class="btn s g" data-a="delsale" data-id="'+s.id+'">✕</button></div></div>'}).join(""):'<p class="mu">Aún no hay cobros.</p>')+'</div>';
}
function vAgenda(){
 var h='<div class="card"><h2>Nueva cita</h2><div class="row"><div><label>Fecha</label><input id="ad" type="date" value="'+ymd(new Date())+'"></div><div><label>Hora</label><input id="at" type="time" value="09:00"></div></div><label>Cliente</label><select id="ac">'+cliOpts()+'</select><label>Servicio</label><select id="as">'+itemOpts()+'</select><label>Nota</label><input id="an" placeholder="Opcional"><button class="btn" data-a="addappt">Agendar</button></div>';
 var l=S.appts.filter(function(a){return !fDate||a.date===fDate}).sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1});
 h+='<div class="card"><h2>Citas</h2><div class="row"><input id="fd" type="date" value="'+fDate+'"><button class="btn s g" data-a="fclear" style="flex:0 0 auto">Ver todas</button></div>';
 h+=l.length?l.map(function(a){var i=item(a.item),st=a.status;return '<div class="item"><div><b>'+a.date+' '+a.time+'</b> '+(st==="pendiente"?'':'<span class="tag'+(st==="cancelada"?' c':'')+'">'+st+'</span>')+'<div class="mu">'+esc(cname(a.client))+' · '+(i?esc(i.name):'—')+(a.note?' · '+esc(a.note):'')+'</div></div><div class="act">'+(st==="pendiente"?'<button class="btn s" data-a="cobrarappt" data-id="'+a.id+'">Cobrar</button><button class="btn s g" data-a="cancelappt" data-id="'+a.id+'">Cancelar</button>':'<button class="btn s g" data-a="delappt" data-id="'+a.id+'">✕</button>')+'</div></div>'}).join(""):'<p class="mu">Sin citas.</p>';
 return h+'</div>';
}
function vClientes(){
 var h='<div class="card"><h2>Nuevo cliente</h2><label>Nombre</label><input id="kn"><div class="row"><div><label>Teléfono</label><input id="kp" type="tel"></div><div><label>Notas</label><input id="kt"></div></div><button class="btn" data-a="addcli">Guardar cliente</button></div>';
 h+='<div class="card"><h2>Clientes ('+S.clients.length+')</h2><input id="ks" placeholder="Buscar…" style="margin-bottom:6px"><div id="kl">'+listCli("")+'</div></div>';
 return h;
}
function listCli(q){
 q=q.toLowerCase();
 var l=S.clients.filter(function(c){return !q||(c.name+" "+(c.phone||"")).toLowerCase().indexOf(q)>-1});
 return l.length?l.map(function(c){var v=S.sales.filter(function(s){return s.client===c.id}),t=v.reduce(function(a,s){return a+s.total},0);return '<div class="item"><div><b>'+esc(c.name)+'</b><div class="mu">'+esc(c.phone||"Sin teléfono")+(c.notes?' · '+esc(c.notes):'')+'<br>'+v.length+' cobros · '+money(t)+'</div></div><button class="btn s g" data-a="delcli" data-id="'+c.id+'">✕</button></div>'}).join(""):'<p class="mu">Sin resultados.</p>';
}
function vResumen(){
 var now=new Date(),td=ymd(now),mo=td.slice(0,7);
 var hoy=S.sales.filter(function(s){return s.date===td}),mes=S.sales.filter(function(s){return s.date.slice(0,7)===mo});
 var sum=function(l){return l.reduce(function(a,s){return a+s.total},0)};
 var h='<div class="grid"><div class="kpi">Hoy<b>'+money(sum(hoy))+'</b><span class="mu">'+hoy.length+' cobros</span></div><div class="kpi">Este mes<b>'+money(sum(mes))+'</b><span class="mu">'+mes.length+' cobros</span></div></div>';
 var pm={};mes.forEach(function(s){pm[s.method]=(pm[s.method]||0)+s.total});
 h+='<div class="card"><h2>Por método de pago (mes)</h2>'+(Object.keys(pm).length?Object.keys(pm).map(function(k){return '<div class="item"><span>'+k+'</span><b>'+money(pm[k])+'</b></div>'}).join(""):'<p class="mu">Sin datos.</p>')+'</div>';
 var top={};mes.forEach(function(s){s.lines.forEach(function(x){top[x.name]=top[x.name]||{q:0,t:0};top[x.name].q+=x.q;top[x.name].t+=x.q*x.price})});
 var tl=Object.keys(top).sort(function(a,b){return top[b].t-top[a].t}).slice(0,5);
 h+='<div class="card"><h2>Lo más vendido (mes)</h2>'+(tl.length?tl.map(function(k){return '<div class="item"><span>'+esc(k)+' <span class="mu">×'+top[k].q+'</span></span><b>'+money(top[k].t)+'</b></div>'}).join(""):'<p class="mu">Sin datos.</p>')+'</div>';
 var pr=S.appts.filter(function(a){return a.status==="pendiente"&&a.date>=td}).sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1}).slice(0,6);
 h+='<div class="card"><h2>Próximas citas</h2>'+(pr.length?pr.map(function(a){return '<div class="item"><span>'+a.date+' '+a.time+' · '+esc(cname(a.client))+'</span><span class="mu">'+(item(a.item)?esc(item(a.item).name):'')+'</span></div>'}).join(""):'<p class="mu">Sin citas pendientes.</p>')+'</div>';
 h+='<div class="card"><h2>Totales</h2><div class="item"><span>Clientes registrados</span><b>'+S.clients.length+'</b></div><div class="item"><span>Cobrado en total</span><b>'+money(sum(S.sales))+'</b></div></div>';
 return h;
}
function vCatalogo(){
 var h='<div class="card"><h2>Nuevo servicio o producto</h2><label>Nombre</label><input id="nn"><div class="row"><div><label>Tipo</label><select id="nt"><option>Servicio</option><option>Producto</option></select></div><div><label>Precio (Bs)</label><input id="np" type="number" min="0" step="0.5"></div></div><button class="btn" data-a="additem">Guardar</button></div>';
 h+='<div class="card"><h2>Catálogo ('+S.items.length+')</h2>'+(S.items.length?S.items.map(function(i){return '<div class="item"><div><b>'+esc(i.name)+'</b><div class="mu">'+i.type+'</div></div><div>'+money(i.price)+' <button class="btn s g" data-a="delitem" data-id="'+i.id+'">✕</button></div></div>'}).join(""):'<p class="mu">Aún no hay nada cargado.</p>')+'</div>';
 return h;
}
function render(){
 var m={cobrar:vCobrar,agenda:vAgenda,clientes:vClientes,resumen:vResumen,catalogo:vCatalogo};
 $("v").innerHTML=(S.demo?'<div class="demo"><span>Datos de ejemplo para la vista previa.</span><button class="btn s" data-a="cleardemo">Borrar ejemplos</button></div>':'')+m[tab]();
}
function val(i){var e=$(i);return e?e.value.trim():""}
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-t]");if(t){go(t.dataset.t);return}
 var b=e.target.closest("[data-a]");if(!b)return;
 var a=b.dataset.a,id=b.dataset.id;
 if(a==="additem"){var n=val("nn"),p=parseFloat(val("np"));if(!n||isNaN(p))return alert("Escribe nombre y precio.");S.items.push({id:uid(),name:n,type:val("nt"),price:p});save();render()}
 else if(a==="delitem"){if(confirm("¿Eliminar este ítem? Los cobros anteriores se conservan.")){S.items=S.items.filter(function(i){return i.id!==id});save();render()}}
 else if(a==="addcli"){var n2=val("kn");if(!n2)return alert("Escribe el nombre.");S.clients.push({id:uid(),name:n2,phone:val("kp"),notes:val("kt")});save();render()}
 else if(a==="delcli"){if(confirm("¿Eliminar este cliente?")){S.clients=S.clients.filter(function(c){return c.id!==id});save();render()}}
 else if(a==="addappt"){if(!val("ad")||!val("at")||!val("as"))return alert("Completa fecha, hora y servicio.");S.appts.push({id:uid(),date:val("ad"),time:val("at"),client:val("ac"),item:val("as"),note:val("an"),status:"pendiente"});save();render()}
 else if(a==="cancelappt"){S.appts.forEach(function(x){if(x.id===id)x.status="cancelada"});save();render()}
 else if(a==="delappt"){S.appts=S.appts.filter(function(x){return x.id!==id});save();render()}
 else if(a==="cleardemo"){S.clients=[];S.appts=[];S.sales=[];S.demo=false;save();render()}
 else if(a==="fclear"){fDate="";render()}
 else if(a==="cobrarappt"){var ap=S.appts.find(function(x){return x.id===id});cart=[{id:ap.item,q:1}];cartClient=ap.client;cartAppt=id;go("cobrar")}
 else if(a==="addcart"){var q=parseInt(val("cq"))||1;cartClient=val("cc");var f=cart.find(function(l){return l.id===val("ci")});if(f)f.q+=q;else cart.push({id:val("ci"),q:q});render()}
 else if(a==="rmcart"){cart.splice(+b.dataset.n,1);cartClient=val("cc");render()}
 else if(a==="pay"){if(!cart.length)return alert("Agrega al menos un ítem.");var d=new Date();
  S.sales.push({id:uid(),date:ymd(d),time:p2(d.getHours())+":"+p2(d.getMinutes()),client:val("cc"),method:val("cm"),total:cartTotal(),lines:cart.map(function(l){var i=item(l.id);return{name:i.name,price:i.price,q:l.q}})});
  if(cartAppt)S.appts.forEach(function(x){if(x.id===cartAppt)x.status="atendida"});
  cart=[];cartAppt=null;cartClient="";save();render()}
 else if(a==="delsale"){if(confirm("¿Eliminar este cobro?")){S.sales=S.sales.filter(function(s){return s.id!==id});save();render()}}
});
document.addEventListener("input",function(e){
 if(e.target.id==="ks")$("kl").innerHTML=listCli(e.target.value);
});
document.addEventListener("change",function(e){
 if(e.target.id==="fd"){fDate=e.target.value;render()}
 if(e.target.id==="cc")cartClient=e.target.value;
});
load();nav();render();
</script>
</body>
</html>
